<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ช่างเอกสายอาชีพ | ใส่รหัสผ่าน</title>
</head>
<body style="font-family:sans-serif; text-align:center; padding-top:100px;">

  <h1>🔆 ช่างเอกสายอาชีพ</h1>
  <p>กรุณาใส่รหัสผ่านเพื่อเข้าใช้งาน</p>

  <input type="password" id="password" placeholder="ใส่รหัสผ่าน">
  <br><br>
  <button onclick="checkPassword()">ยืนยัน</button>

  <p id="result"></p>

  <script>
    function checkPassword() {
      const pass = document.getElementById("password").value;
      if (pass === "SOLAR123") {
        document.getElementById("result").innerText =
          "✅ ผ่านแล้ว (ขั้นตอนต่อไปเดี๋ยวค่อยทำ)";
      } else {
        document.getElementById("result").innerText =
          "❌ รหัสไม่ถูกต้อง";
      }
    }
  </script>

</body>
</html>
